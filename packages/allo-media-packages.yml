note: >-
  Allo-Media now trades as uh!ive and publishes its client libraries under the
  GitHub org `uhlive` (github.com/uhlive), whose profile links back to
  https://www.uh.live. The Allo-Media GitHub org (github.com/allo-media,
  "Groupe Allo-Media") also lists https://uh.live as its website, which is the
  provider's own confirmation that the uh.live / uhlive surface belongs to this
  company. Versions and publish dates below were read from the registry
  metadata endpoints (registry.npmjs.org, pypi.org/pypi/<pkg>/json) on
  2026-08-17.
