aid: allo-media
name: Allo-Media
description: >-
  Allo-Media, which now trades as uh!ive, is a French conversational-voice-AI
  company that transcribes and analyses telephone conversations in real time and
  in batch. Its platform pairs speech-to-text tuned for 8kHz telephony with named
  entity recognition and redaction, speech analytics (intent, emotion and
  compliance tagging) and call tracking, hosted in France. Developers integrate
  through four surfaces: a read-only Activate REST API over processed calls and
  their transcripts, a WebSocket Stream API for live human-to-human conversations,
  an MRCP/WebSocket Stream API for voicebots, and a browser call-tracking script
  (Hermes), plus SFTP batch ingestion (JUpload) and an HMAC-signed webhook.
  Authentication is OAuth 2.0 client_credentials against a Keycloak realm;
  credentials are issued by an account manager rather than self-service.
