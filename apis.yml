- aid: allo-media-stream-api-humans
  name: Allo-Media Stream API for Humans
  description: >-
    Real-time transcription of live human-to-human conversations over a WebSocket
    (Phoenix Channels). A client joins a conversation, streams binary audio
    chunks, and receives interim and final decoded segments plus speaker join and
    leave events, named entities and analytics tags. Protocol V2 is current, V1 is
    deprecated. Bandwidth is capped at 20 kB/second per connection.
  humanURL: https://docs.allo-media.net/stream-h2h/
  baseURL: https://api.uh.live
  tags:
  - Speech Recognition
  - Streaming
  - WebSocket
  - Real Time
