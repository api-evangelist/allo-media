apis:
- aid: allo-media-activate-api
  name: Allo-Media Activate API
  description: >-
    Read-only REST API over calls that have finished processing on the Allo-Media
    platform — transcription, redaction, analysis and tagging complete. Three
    operations: list calls with date/status filters and limit/offset paging,
    retrieve one call by unique_id, and download that call's audio. Audio past its
    GDPR retention window returns HTTP 451. Version 3.0.0, on the base
    https://activate.uh.live since 2024-07-01.
  humanURL: https://docs.allo-media.net/activate-api/rest/
  baseURL: https://activate.uh.live
