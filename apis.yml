- aid: allo-media-stream-api-voicebots
  name: Allo-Media Stream API for Voicebots
  description: >-
    Real-time speech recognition for voicebots and IVR (human-to-bot), offered
    over either MRCP or WebSocket, with regex-based grammars constraining expected
    input. Documents its own input/output model, grammar availability and
    troubleshooting guidance.
  humanURL: https://docs.allo-media.net/stream-h2b/
  baseURL: https://api.uh.live
