- aid: allo-media-hermes
  name: Allo-Media Hermes Call Tracking
  description: >-
    First-party browser JavaScript that performs dynamic number insertion so an
    inbound phone call can be attributed back to a web session — the mechanism
    behind the Vocal Cookie lead-attribution product. Loaded as an unpinned script
    from the provider's CDN, exposes the `am` global, and documents a cookieless
    tracking mode plus localStorage and selector-scoping options.
  humanURL: https://docs.allo-media.net/hermes/
  baseURL: https://hermes.allo-media.net
  tags:
  - Call Tracking
  - JavaScript
  - Attribution
  - Marketing
  properties:
