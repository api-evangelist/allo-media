note: >-
  Allo-Media / uh!ive publishes NO plans, NO tiers and NO prices. The commercial
  route is a demo request (https://uh.live/en/get-a-demo/) and, throughout the
  developer documentation, an account manager: API credentials, webhook
  subscriptions, JUpload SFTP accounts and the GPG public key are all obtained by
  contacting "your account manager at Allo-Media". There is no self-service
  signup, no free tier, no trial, and no published unit price for transcription
  minutes or call volume. This is an honest zero — enterprise, sales-led,
  contact-us pricing — not a gap in our search.
  The provider is aware of this: "Enhancing API self-service onboarding
  capabilities" appears on their own public roadmap under "Later"
  (https://docs.allo-media.net/products-description/roadmap/, last updated
  2026-01-16).
