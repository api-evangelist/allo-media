note: >-
  Cross-cutting standards conformance, assessed from two sources: the provider's
  published documentation, and two documents we fetched live and saved verbatim —
  the RFC 9116 security.txt (well-known/allo-media-security.txt) and the Keycloak
  realm's OIDC discovery document
  (well-known/allo-media-openid-configuration.json). No OpenAPI was reachable, so
  nothing here is derived from an API spec. Every `conforms: true` cites either a
  documentation page or one of those two captured documents, and every
  `conforms: false` means "we looked and found no published evidence", not "the
  provider fails a test we ran".
  Deliberately NO `Compliance` pointer is emitted in apis.yml: GDPR-driven data
  retention is documented as behaviour, but no compliance PROGRAM page, trust
  centre, or named certification (SOC 2, ISO 27001, HDS, PCI DSS) was reachable
  and verifiable during this pass. Emitting Compliance on that basis would credit
  a posture we could not confirm.
standards:
  - id: oauth2
    name: OAuth 2.0
    conforms: true
    profile: client_credentials grant (RFC 6749 §4.4)
    evidence: >-
      Token endpoint https://id.uh.live/realms/uhlive/protocol/openid-connect/token
      with client_id/client_secret and grant_type=client_credentials, documented
      for both the Activate REST API and the Stream API.
    source: https://docs.allo-media.net/activate-api/rest/authentication/
  - id: oidc
    name: OpenID Connect (Discovery 1.0)
    conforms: true
    evidence: >-
      https://id.uh.live/realms/uhlive/.well-known/openid-configuration returned
      HTTP 200 application/json (6,625 bytes) on 2026-08-17, captured verbatim at
      well-known/allo-media-openid-configuration.json. Complete discovery
      document: issuer, authorization/token/userinfo/introspection/revocation/
      end-session/device-authorization endpoints, jwks_uri, 10 grant types, 19
      scopes, PKCE methods, and a dynamic client registration endpoint. The
      provider does not LINK this document anywhere in its docs, but it serves it.
    source: https://id.uh.live/realms/uhlive/.well-known/openid-configuration
    detail: scopes/allo-media-scopes.yml
  - id: rfc8414-oauth-metadata
    name: RFC 8414 OAuth 2.0 Authorization Server Metadata
    conforms: partial
    evidence: >-
      The realm serves OIDC discovery at the openid-configuration path, which
      carries the same metadata, but the RFC 8414
      /.well-known/oauth-authorization-server path itself was not confirmed
      (probe blocked by the origin's rate limiting).
  - id: rfc8705-mtls
    name: RFC 8705 OAuth 2.0 mutual-TLS client authentication and certificate-bound tokens
    conforms: true
    evidence: >-
      Discovery advertises `tls_client_auth` in
      token_endpoint_auth_methods_supported and
      `tls_client_certificate_bound_access_tokens: true`. Capability is real and
      advertised; the provider documents none of it.
    source: well-known/allo-media-openid-configuration.json
  - id: rfc9449-dpop
    name: RFC 9449 DPoP (demonstrating proof of possession)
    conforms: true
    evidence: >-
      Discovery advertises `dpop_signing_alg_values_supported` with 10 algorithms.
      Undocumented for API consumers.
    source: well-known/allo-media-openid-configuration.json
  - id: rfc7636-pkce
    name: RFC 7636 PKCE
    conforms: partial
    evidence: >-
      `code_challenge_methods_supported: [plain, S256]`. S256 is present, but
      `plain` is still advertised — the weaker method OAuth 2.1 removes.
    source: well-known/allo-media-openid-configuration.json
  - id: rfc7591-dynamic-client-registration
    name: RFC 7591 OAuth 2.0 Dynamic Client Registration
    conforms: true
    evidence: >-
      `registration_endpoint:
      https://id.uh.live/realms/uhlive/clients-registrations/openid-connect`
      advertised in discovery. Whether it is open or gated was not tested — we do
      not probe registration endpoints.
    source: well-known/allo-media-openid-configuration.json
  - id: rfc6750-bearer
    name: OAuth 2.0 Bearer Token Usage (RFC 6750)
    conforms: partial
    evidence: >-
      The Activate API uses `Authorization: bearer {access_token}` (header form,
      RFC 6750 §2.1). The Stream API instead passes the token as a `jwt` URI
      query parameter, which is the form RFC 6750 §2.3 discourages.
    source: https://docs.allo-media.net/stream-h2h/protocol/
  - id: rfc9457-problem-details
    name: RFC 9457 Problem Details for HTTP APIs
    conforms: false
    evidence: >-
      No `application/problem+json` and no error schema published; errors are
      bare HTTP status codes with free text.
    detail: errors/allo-media-error-codes.yml
  - id: rfc8594-sunset
    name: RFC 8594 Sunset HTTP Header
    conforms: false
    evidence: >-
      A deprecation/older-version page exists but no Sunset or Deprecation
