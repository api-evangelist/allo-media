  headline: >-
    The strongest conformance story here is the identity layer, and the provider
    documents none of it: a real OIDC discovery document, mTLS-bound access
    tokens, DPoP, private_key_jwt, PKCE and dynamic client registration, all
    verifiable from one anonymous fetch. The weakest is the API contract layer —
    no OpenAPI, no AsyncAPI, no RFC 9457 errors, no RFC 8594 sunset headers.
    Allo-Media has better security machinery than its documentation admits and
    worse machine-readability than its product warrants.
