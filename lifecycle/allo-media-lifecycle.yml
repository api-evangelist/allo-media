x-rebrand:
  from: Allo-Media (allo-media.net)
  to: uh!ive (uh.live)
  evidence:
    - https://www.allo-media.net/ 301s to https://uh.live/en/
    - github.com/allo-media ("Groupe Allo-Media") lists https://uh.live as its website
    - github.com/uhlive ("uh!ive") lists https://www.uh.live
    - API hosts moved from api.allo-media.net to activate.uh.live / api.uh.live at v3.0.0
  note: >-
    The company-level rename is itself an unmanaged lifecycle event for API
    consumers: the documentation still lives on docs.allo-media.net under the old
    brand while every runtime host has moved to uh.live, and the webhook
    signature header is already `X-Uhlive-Signature`.
