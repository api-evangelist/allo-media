versioning:
  scheme: major version tied to the base hostname
  current: 3.0.0
  current_since: '2024-07-01'
  docs: https://docs.allo-media.net/activate-api/rest/releases-notes/
  note: >-
    There is no version path segment and no version header. The version IS the
    host: v1.x lives on https://api.allo-media.net, v3.0.0 lives on
    https://activate.uh.live. A client cannot negotiate versions on one origin,
    and the cutover also changed the authentication method, so it is a hard
    migration rather than a versioned upgrade.
deprecation:
  policy_url: https://docs.allo-media.net/activate-api/rest/older-version/
  policy_published: true
  sunset_header: false
  deprecation_header: false
  sunset_date: null
  detail: >-
    The provider maintains a dedicated "older version" page for the pre-v3 API
    ("If you've started using the API before July, 1st 2024, this is the page for
    you") documenting the superseded base URL https://api.allo-media.net
    alongside the current one. v3.0.0 is described as deprecating "some keys in
    the payload" and adding new ones.
    WHAT IS MISSING, and it matters: no sunset date for the old base URL, no
    RFC 8594 `Sunset` or `Deprecation` response headers, and no list of which
    payload keys were actually deprecated. Two years after the cutover a
    v1-era integration has no machine-readable warning and no published
    end-of-life to plan against.
  deprecated_versions:
    - version: 1.x
      base_url: https://api.allo-media.net
      superseded: '2024-07-01'
      superseded_by: 3.0.0
      docs: https://docs.allo-media.net/activate-api/rest/older-version/
      still_documented: true
      sunset_date: null
  deprecated_surfaces:
    - name: Stream API protocol V1
      status: deprecated
      superseded_by: Stream API protocol V2
      docs: https://docs.allo-media.net/stream-h2h/protocol-v1/
      sunset_date: null
      note: >-
        Both V1 and V2 protocol references are published side by side, V1 marked
        deprecated, with no sunset date.
