roadmap:
  url: https://docs.allo-media.net/products-description/roadmap/
  published: true
  last_updated: '2026-01-16'
  buckets: [Previously achieved, In progress, Next, Later]
  note: >-
    A genuinely public, dated, four-bucket product roadmap — rare for a company
    this size. API-relevant items include, verbatim from the page's themes:
    "Better integrating Stream H2H into the core platform" (Next), and under
    Later, "Enhancing API self-service onboarding capabilities", "Exposing
    additional platform usage data and metrics", and "Implementing granular data
    retention policies". The provider is therefore aware that self-service API
    onboarding is a gap — it is on their own roadmap.
data_retention:
  documented: true
  docs: https://docs.allo-media.net/jupload/data-retention/
  enforcement: >-
    Retention is enforced destructively and surfaced in the API: call audio past
    its retention window returns HTTP 451 Unavailable For Legal Reasons, and the
    Call object carries an `audio_state` field ("available" / "missing").
    JUpload error logs are themselves deleted after 60 days.
  note: GDPR-driven per the Activate API call documentation.
