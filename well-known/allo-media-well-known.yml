note: >-
  Probed 2026-08-17. TWO real documents were served and both are saved verbatim:
  an RFC 9116 security.txt on the marketing host, and a full Keycloak OpenID
  Connect discovery document on the identity host. Everything else is a genuine
  404 or a soft-404, and is recorded as a miss.
  PROBE CONDITIONS, because they shaped this file: the provider's OVH-hosted
  origins (uh.live, api.uh.live, id.uh.live, activate.uh.live, api.allo-media.net,
  hermes.allo-media.net) refuse TCP 443 from a single source IP for several
  minutes after a short burst of requests. Our first pass therefore recorded
  status 0 on paths that are in fact live; a paced retry recovered them. Any entry
  below marked `status: 0` means "our connection was refused", NOT "the provider
  does not serve this" — the distinction is preserved deliberately so a later run
  does not read a rate-limit as an absence.
  The docs host, docs.allo-media.net (Cloudflare Pages,
  am-documentation-public-2.pages.dev), answers HTTP 200 with the documentation
  homepage — an identical 15,384-byte text/html body — for EVERY unknown path,
  including all /.well-known/* paths. That is a soft-404 catch-all, not a
  document, and every such result is scored as a miss.
